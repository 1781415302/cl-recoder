[package]
name = "cl-recoder"
version.workspace = true
edition.workspace = true
description = "CL Recoder GUI 进程（Tauri v2，中完整性）：托盘与窗口、全部 commands、导入/导出"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
# DEVPLAN-input-live-trigger S0（§3 G5）：GUI live pipe 客户端需要 OVERLAPPED I/O
# （ReadFile/WriteFile/CancelIoEx）；与 collector 已用的 Win32_System_IO 对齐，不新增包。
windows = { workspace = true, features = ["Win32_System_IO"] }
chrono = { workspace = true }
dirs = { workspace = true }
clrecoder-core = { path = "../crates/core" }
clrecoder-store = { path = "../crates/store" }
# S1（§4.1）：gui 角色 sink（gui.log）+ 旧 gui_log! 宏的持久化适配入口。
clrecoder-diagnostics = { path = "../crates/diagnostics" }

[target.'cfg(windows)'.dependencies]
# 使用 Tauri 已锁定的 WebView2 绑定，监听本窗口的进程故障。
webview2-com = "=0.39.1"
