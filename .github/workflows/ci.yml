name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run lint
      - run: npm --prefix ui test
      - run: npm --prefix ui run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p clrecoder-collector --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: collector-task-policy (pwsh)
        run: pwsh -NoLogo -NoProfile -File scripts/tests/collector-task-policy.tests.ps1
      - name: collector-task-policy (powershell)
        shell: powershell
        run: powershell -NoLogo -NoProfile -File scripts/tests/collector-task-policy.tests.ps1
      - name: collector-path-trust (pwsh)
        run: pwsh -NoLogo -NoProfile -File scripts/tests/collector-path-trust.tests.ps1
      - name: collector-path-trust (powershell)
        shell: powershell
        run: powershell -NoLogo -NoProfile -File scripts/tests/collector-path-trust.tests.ps1
